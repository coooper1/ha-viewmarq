publish_status:
  name: Publish a temporary status page
  description: Adds or refreshes a host-supplied page. It expires automatically unless refreshed. Supply actual measured usage or task state; the integration does not estimate completion.
  fields:
    entry_id:
      name: Display
      required: true
      selector:
        config_entry:
          integration: viewmarq
    source:
      name: Source name
      required: true
      example: codex_usage
      selector:
        text:
    message:
      name: Status text
      description: Leave empty to remove this source's page.
      required: true
      selector:
        text:
          multiline: true
    ttl:
      name: Expire after seconds
      default: 120
      selector:
        number:
          min: 10
          max: 900
          unit_of_measurement: s
    color:
      name: Text color
      description: Optional. Uses the display's normal color when omitted.
      selector:
        select:
          options:
            - green
            - amber
            - red
